<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- Solid White Circle Background with Brand Green Border -->
    <circle cx="256" cy="256" r="240" fill="#ffffff" stroke="#627750" stroke-width="24" />
    
    <!-- Bold Tropical Coconut Drink Icon (Highly visible at 16x16) -->
    <g fill="#627750">
        <!-- Coconut Body -->
        <path d="M256,160 C170,160 150,230 150,300 C150,380 200,410 256,410 C312,410 362,380 362,300 C362,230 342,160 256,160 Z" />
        
        <!-- Inside of Coconut (White Cutout) -->
        <ellipse cx="256" cy="190" rx="80" ry="24" fill="#ffffff" />
        
        <!-- Drinking Straw -->
        <rect x="275" y="80" width="18" height="150" rx="9" transform="rotate(30 275 80)" />
        
        <!-- Tropical Flower Accent (Brand Coral & Amber) -->
        <path d="M170,180 C150,150 120,160 110,190 C130,210 160,200 170,180 Z" fill="#E07A5F" />
        <path d="M155,195 C135,215 145,245 175,245 C185,225 175,195 155,195 Z" fill="#E07A5F" />
        <circle cx="160" cy="205" r="10" fill="#F4A261" />
    </g>
</svg>